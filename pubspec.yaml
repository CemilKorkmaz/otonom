name: otonom
description: "Otonom - Canlı Harita, GPS, OSRM Rota, Overpass Şarj/Benzin/Çekici, NHTSA & EPA API Bağlantılı Otomobil Süper Uygulaması"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  flutter_map: '>=7.0.2 <9.0.0'
  latlong2: ^0.9.1
  geolocator: '>=13.0.0 <15.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

name: Otonom Android APK Release Builder

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Bootstrap Gradle/Xcode wrapper files while preserving all Otonom code
        run: |
          mkdir -p /tmp/otonom-backup/drawable
          cp pubspec.yaml /tmp/otonom-backup/pubspec.yaml
          cp analysis_options.yaml /tmp/otonom-backup/analysis_options.yaml
          cp -r lib /tmp/otonom-backup/lib
          cp -r test /tmp/otonom-backup/test
          cp android/app/src/main/AndroidManifest.xml /tmp/otonom-backup/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/otonom/otonom/MainActivity.kt /tmp/otonom-backup/MainActivity.kt
          cp android/app/src/main/res/drawable/ic_launcher_*.xml /tmp/otonom-backup/drawable/
          cp ios/Runner/Info.plist /tmp/otonom-backup/Info.plist
          cp ios/Runner/AppDelegate.swift /tmp/otonom-backup/AppDelegate.swift

          flutter create --org com.otonom --project-name otonom --platforms=android,ios .

          cp /tmp/otonom-backup/pubspec.yaml pubspec.yaml
          cp /tmp/otonom-backup/analysis_options.yaml analysis_options.yaml
          rm -rf lib test
          cp -r /tmp/otonom-backup/lib lib
          cp -r /tmp/otonom-backup/test test
          cp /tmp/otonom-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          mkdir -p android/app/src/main/kotlin/com/otonom/otonom
          cp /tmp/otonom-backup/MainActivity.kt android/app/src/main/kotlin/com/otonom/otonom/MainActivity.kt
          mkdir -p android/app/src/main/res/drawable
          cp /tmp/otonom-backup/drawable/ic_launcher_*.xml android/app/src/main/res/drawable/
          cp /tmp/otonom-backup/Info.plist ios/Runner/Info.plist
          cp /tmp/otonom-backup/AppDelegate.swift ios/Runner/AppDelegate.swift

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Flutter unit & widget tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build Installable Android Release APK (v1.3.0)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk otonom-v1.3.0-android.apk
          ls -lh otonom-v1.3.0-android.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otonom-v1.3.0-android-apk
          path: otonom-v1.3.0-android.apk

      - name: Publish GitHub Release v1.3.0 with Direct APK Download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 otonom-v1.3.0-android.apk --clobber
          else
            gh release create v1.3.0 otonom-v1.3.0-android.apk \
              --target "${{ github.sha }}" \
              --title "Otonom v1.3.0 — Tam Ekran Turn-by-Turn Navigasyon, iPhone iOS Liquid-Glass Arayüz & ECC Denetimi" \
              --notes "v1.3.0 yenilikleri: (1) Rota ekranında arama yapıp 'Rota Oluştur / Başlat' dendiğinde Google/Apple Haritalar tarzı %100 tam ekran, 17.3x yakınlaştırılmış, sürüş yönüne dönen (Heading-Up), canlı hız göstergeli (km/s), adım adım dönüş kartlı, otomatik yeniden rotalamalı ve canlı demo sürüş simülasyonlu Navigasyon Modu eklendi; (2) Tüm uygulama arayüzü iPhone / iOS Cupertino Liquid-Glass (buzlu cam BackdropFilter, yüzen kapsül alt bar, CupertinoSlidingSegmentedControl, elastik BouncingScrollPhysics ve dokunsal HapticFeedback) tasarım diline geçirildi; (3) affaan-m/ECC ajanlarıyla (flutter-reviewer, silent-failure-hunter, security-reviewer, liquid-glass-design) baştan aşağı kod/güvenlik denetimi yapılarak varsayılan nötr Otonom ikonu, HTTPS doğrulama, yarış durumu (race-condition) koruması ve HTTP bağlantı havuzu iyileştirmeleri tamamlandı."
          fi

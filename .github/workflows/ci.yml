name: Otonom Android APK Release Builder

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Bootstrap Gradle/Xcode wrapper files while preserving all Otonom code
        run: |
          mkdir -p /tmp/otonom-backup/drawable
          cp pubspec.yaml /tmp/otonom-backup/pubspec.yaml
          cp analysis_options.yaml /tmp/otonom-backup/analysis_options.yaml
          cp -r lib /tmp/otonom-backup/lib
          cp -r test /tmp/otonom-backup/test
          cp android/app/src/main/AndroidManifest.xml /tmp/otonom-backup/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/otonom/otonom/MainActivity.kt /tmp/otonom-backup/MainActivity.kt
          cp android/app/src/main/res/drawable/ic_launcher_*.xml /tmp/otonom-backup/drawable/
          cp ios/Runner/Info.plist /tmp/otonom-backup/Info.plist
          cp ios/Runner/AppDelegate.swift /tmp/otonom-backup/AppDelegate.swift

          flutter create --org com.otonom --project-name otonom --platforms=android,ios .

          cp /tmp/otonom-backup/pubspec.yaml pubspec.yaml
          cp /tmp/otonom-backup/analysis_options.yaml analysis_options.yaml
          rm -rf lib test
          cp -r /tmp/otonom-backup/lib lib
          cp -r /tmp/otonom-backup/test test
          cp /tmp/otonom-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          mkdir -p android/app/src/main/kotlin/com/otonom/otonom
          cp /tmp/otonom-backup/MainActivity.kt android/app/src/main/kotlin/com/otonom/otonom/MainActivity.kt
          mkdir -p android/app/src/main/res/drawable
          cp /tmp/otonom-backup/drawable/ic_launcher_*.xml android/app/src/main/res/drawable/
          cp /tmp/otonom-backup/Info.plist ios/Runner/Info.plist
          cp /tmp/otonom-backup/AppDelegate.swift ios/Runner/AppDelegate.swift

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Flutter unit & widget tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build Installable Android Release APK (v1.2.0)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk otonom-v1.2.0-android.apk
          ls -lh otonom-v1.2.0-android.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otonom-v1.2.0-android-apk
          path: otonom-v1.2.0-android.apk

      - name: Publish GitHub Release v1.2.0 with Direct APK Download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 otonom-v1.2.0-android.apk --clobber
          else
            gh release create v1.2.0 otonom-v1.2.0-android.apk \
              --target "${{ github.sha }}" \
              --title "Otonom v1.2.0 — Dünya Üzerindeki Her Aracı Eklenebilir Garaj, Derin Ansiklopedi, Koyu Harita & Birleşik Canlı POI Sürümü" \
              --notes "Gerçek cihaz geri bildirimlerine göre v1.2.0 yenilikleri: (1) Harita Koyu Mod (Dark Mode) OpenStreetMap + GPU Kokpit Matrisi ile %100 kesintisiz çalışacak şekilde düzeltildi, (2) EV Şarj, Kiralama ve Çekici/Servis API'leri tekli hızlı Overpass node sorgusu + Photon Komoot OSM yedeklemesi ile birleştirilerek 429/504 hatası giderildi, (3) Alt menüdeki 'Çekici & 112' tek satır 'Acil' olarak güncellendi ve acil durum ikonu eklendi, (4) Garajım'daki örnek araçlar kaldırıldı; dünya üzerindeki herhangi bir marka, model, yıl ve paketteki aracı ekleme özelliği ve eklenen aracın Wikipedia görseli + 10 noktalı OEM cıvata/lokma/Nm tork tablosu + sıvı onay kodları + ekspertiz rehberi ile Ansiklopedi'de ultra detaylı gösterimi eklendi."
          fi
